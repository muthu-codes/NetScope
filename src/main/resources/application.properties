spring.application.name=NetScope
server.port=8080

# SAFE DEFAULT: only this computer can reach the API/dashboard.
# Change to 0.0.0.0 only if you add authentication first (see docs/security.md).
server.address=127.0.0.1

# ------------------------------------------------------------------
# Database
# Default = embedded H2 file database in ./data (MySQL-compatible mode, no install needed).
# For MySQL: run with  --spring.profiles.active=mysql  (see application-mysql.properties)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/netscope;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.netscope=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-28logger{28} : %msg%n

# Browsers allowed to call the API (Vite dev server).
netscope.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ------------------------------------------------------------------
# AUTHORIZED SCAN SCOPE  (read docs/security.md)
#
# mode=AUTO        -> scan only the subnet this computer is connected to. No confirmation needed.
# mode=CONFIGURED  -> scan the CIDR blocks listed below (comma separated), e.g.
#                     netscope.scope.cidrs=10.10.0.0/16,172.16.20.0/24
#                     Anything outside the local subnet is scanned ONLY when
#                     authorization-confirmed=true (you confirm you have written permission).
# Only private ranges (10/8, 172.16/12, 192.168/16, 100.64/10) are ever accepted.
# ------------------------------------------------------------------
netscope.scope.mode=AUTO
netscope.scope.cidrs=
netscope.scope.authorization-confirmed=false
netscope.scope.authorized-by=
netscope.scope.max-targets=70000

# ------------------------------------------------------------------
# Scanner behaviour (rate control)
# ------------------------------------------------------------------
netscope.scan.concurrency=64
netscope.scan.ping-timeout-ms=800
netscope.scan.delay-between-probes-ms=0
netscope.scan.hostname-timeout-ms=1200
netscope.scan.netbios-enabled=true

# Full sweep of the whole scope every N seconds; between sweeps only known devices are re-pinged.
netscope.monitor.enabled=true
netscope.monitor.full-scan-interval-seconds=900
netscope.monitor.refresh-interval-seconds=30
netscope.monitor.tick-ms=5000
netscope.monitor.initial-delay-ms=5000
netscope.monitor.returned-after-seconds=1800

# Layer-3 path discovery (traceroute) used to draw routed subnets in the topology.
netscope.topology.traceroute-enabled=true
netscope.topology.max-hops=12
netscope.topology.trace-refresh-seconds=900
netscope.topology.max-traced-subnets=64

# Health thresholds used for issues + diagnosis.
netscope.health.high-latency-ms=150
netscope.health.critical-latency-ms=300
netscope.health.loss-warning-percent=10
netscope.health.loss-critical-percent=40
netscope.health.jitter-warning-ms=50
netscope.health.history-size=20

# Network diagnostics targets (one ICMP probe + one DNS lookup; leave blank to disable).
netscope.diagnostics.internet-target=8.8.8.8
netscope.diagnostics.dns-test-host=example.com

netscope.retention.observation-days=7

# Optional: path to the full IEEE OUI list (https://standards-oui.ieee.org/oui/oui.csv) for better vendor names.
netscope.oui.file=

# ------------------------------------------------------------------
# Security
# Production credentials MUST be supplied through environment variables.
# ------------------------------------------------------------------
netscope.security.username=${NETSCOPE_ADMIN_USERNAME}
netscope.security.password=${NETSCOPE_ADMIN_PASSWORD}