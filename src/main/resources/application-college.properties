# Activate with:  mvn spring-boot:run "-Dspring-boot.run.profiles=college"
# Use this profile ONLY for a network you have written permission to scan.
#
# 1. Put the campus address blocks below (private ranges only), e.g. 10.114.0.0/16 or 10.114.32.0/24,10.114.33.0/24
# 2. Keep authorization-confirmed=true only if you hold written permission from the network owner.
# 3. Write who approved it in authorized-by - it is recorded in the audit log and shown in the UI.
netscope.scope.mode=CONFIGURED
netscope.scope.cidrs=
netscope.scope.authorization-confirmed=true
netscope.scope.authorized-by=

# Gentler on the network but fast enough for a /16: ~96 probes in flight, 700 ms timeout.
netscope.scan.concurrency=96
netscope.scan.ping-timeout-ms=700

# Full sweep every 30 min on a big network; known devices are re-checked every 30 s in between.
netscope.monitor.full-scan-interval-seconds=1800
