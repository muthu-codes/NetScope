# Activated with:  mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Create the DB user first (see scripts/setup-database.ps1) or use root for local testing.
spring.datasource.url=jdbc:mysql://localhost:3306/netscope?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${NETSCOPE_DB_USER:root}
spring.datasource.password=${NETSCOPE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
